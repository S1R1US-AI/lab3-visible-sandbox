# Example only. Copy to .github/workflows/ only after src/ Jev is gone.
# Path-filtered. No npm ci. No Grok. No TypeSafe.
name: lab3-locks
on:
  pull_request:
    paths:
      - "src/**"
      - "ops/outer-jev/**"
      - "package.json"
jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node ops/outer-jev/scan-runtime.mjs
      - run: node --experimental-strip-types --test src/lib/drift-lock.test.ts
